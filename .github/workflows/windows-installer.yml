name: windows-installer

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Fetch externals
        shell: pwsh
        run: pwsh windows/build/fetch-externals.ps1

      - name: Assemble payload
        shell: pwsh
        run: pwsh windows/build/assemble-payload.ps1

      - name: Build launcher
        shell: pwsh
        run: pwsh windows/build/build-launcher.ps1

      - name: Build installer
        shell: pwsh
        run: pwsh windows/build/build-installer.ps1

      - name: Find installer artifact
        id: find
        shell: pwsh
        run: |
          $exe = Get-ChildItem windows/installer/Output -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) { throw "No installer .exe produced" }
          "path=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "name=$($exe.Name)"     | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: ${{ steps.find.outputs.path }}
          retention-days: 14

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find.outputs.path }}
