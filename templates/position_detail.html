{% extends "base.html" %}
{% block title %}Position {{ account }}/{{ instrument }} — FuturesTradingLog{% endblock %}
{% block content %}
  <div
    id="detail-root"
    data-account="{{ account }}"
    data-instrument="{{ instrument }}"
    data-entry-execution-id="{{ entry_execution_id }}"
  >
    <a href="/positions">&larr; Back to positions</a>
    <h1 id="detail-title">Loading...</h1>
    <dl class="detail-header" id="detail-header"></dl>
    <div class="chart-slot" id="chart-root"></div>
    <div class="notes-panel" id="notes-panel"></div>
    <div class="reviewed-toggle" id="reviewed-toggle"></div>
    <section id="custom-fields-block"></section>
    <h2>Executions</h2>
    <div id="executions-root"></div>
    <h2>Danger zone</h2>
    <button class="danger" id="delete-button">Delete this position</button>
  </div>
{% endblock %}
{% block scripts %}
  <script src="{{ url_for('static', filename='vendor/lightweight-charts.standalone.production.js') }}"></script>
  <script type="module" src="{{ url_for('static', filename='js/position_detail.js') }}"></script>
{% endblock %}
