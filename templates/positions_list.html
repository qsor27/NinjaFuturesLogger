{% extends "base.html" %}
{% block title %}Positions — FuturesTradingLog{% endblock %}
{% block extra_styles %}
<style>
  #list-root table.positions-table { width: auto; table-layout: auto; }
  #list-root table.positions-table th,
  #list-root table.positions-table td { white-space: nowrap; }
  #list-root table.positions-table th { cursor: grab; user-select: none; }
  #list-root table.positions-table th:active { cursor: grabbing; }
  #list-root table.positions-table th.col-dragging { opacity: 0.4; }
  #list-root table.positions-table th.col-drop-target { background: var(--accent-soft, rgba(139,92,246,0.25)); }
</style>
<link rel="stylesheet" href="{{ url_for('static', filename='css/multiselect.css') }}">
{% endblock %}
{% block content %}
  <h1>Positions</h1>
  <div id="back-to-stats" class="back-link" hidden></div>
  <form class="filters" id="filter-form">
    <label>Account
      <div id="account-filter-host"></div>
    </label>
    <label>Instrument
      <select name="instrument"><option value="">All</option></select>
    </label>
    <label>Side
      <select name="side">
        <option value="">All</option>
        <option value="Long">Long</option>
        <option value="Short">Short</option>
      </select>
    </label>
    <label>Outcome
      <select name="outcome">
        <option value="">All</option>
        <option value="winner">Winner</option>
        <option value="loser">Loser</option>
        <option value="scratch">Scratch</option>
        <option value="open">Open</option>
      </select>
    </label>
    <label>Preset
      <select name="date_preset" id="filter-date-preset"></select>
    </label>
    <label>From (session)
      <input type="date" name="session_date_from">
    </label>
    <label>To (session)
      <input type="date" name="session_date_to">
    </label>
    <label>Day of week
      <select name="day_of_week">
        <option value="">Any</option>
        <option value="0">Mon</option>
        <option value="1">Tue</option>
        <option value="2">Wed</option>
        <option value="3">Thu</option>
        <option value="4">Fri</option>
      </select>
    </label>
    <label>Hour
      <select name="hour_of_day">
        <option value="">Any</option>
        {% for h in range(24) %}
        <option value="{{ h }}">{{ '%02d:00' % h }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Trades/day
      <input type="number" name="trades_per_day" min="1" step="1">
    </label>
    <input type="hidden" name="hour_tz">
    <button type="button" id="filter-clear">Clear</button>
    <button type="button" id="filter-save-default">Save as default</button>
    <button type="button" id="filter-clear-default" hidden>Clear default</button>
  </form>
  <div id="list-root"></div>
  <div class="pagination" id="pagination-root"></div>
{% endblock %}
{% block scripts %}
  <script type="module" src="{{ url_for('static', filename='js/positions_list.js') }}"></script>
{% endblock %}
