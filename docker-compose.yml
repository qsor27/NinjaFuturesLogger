services:
  web:
    build: .
    image: ghcr.io/qsor27/ninjafutureslogger:latest
    container_name: ninjafutureslogger
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # EDIT THIS LINE: replace the left side with the path to your data folder.
      # Use forward slashes even on Windows. Example: C:/FuturesTradingLog
      # Do NOT use a folder inside OneDrive, Dropbox, Google Drive, or any cloud sync.
      - C:/FuturesTradingLog:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

